<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ plan.title }} · Fuel Stop Planner</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9;
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d2433; }
    main { max-width: 520px; margin: 16px; background: #fff; border: 1px solid #e3e7ee; border-radius: 10px; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    code { background: #f1f3f6; padding: 1px 5px; border-radius: 4px; }
    a { color: #0b6bcb; }
  </style>
</head>
<body>
  <main>
    <h1>{{ plan.status }} · {{ plan.title }}</h1>
    <p>{{ plan.detail }}</p>
    {% if plan.errors %}<ul>{% for field, messages in plan.errors.items %}<li><code>{{ field }}</code>: {{ messages|join:" " }}</li>{% endfor %}</ul>{% endif %}
    <p><code>{{ plan.code }}</code> · <a href="/api/docs/">API docs</a></p>
  </main>
</body>
</html>
